[package]
name = "editio"
version = "0.1.0"
edition = "2021"
description = "Editio document compiler binary"

[[bin]]
name = "editio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
editio-ast = { path = "../editio-ast" }
editio-parser = { path = "../editio-parser" }
editio-pdf = { path = "../editio-pdf" }
