[workspace]
members = [
    "crates/editio",
    "crates/editio-core",
    "crates/editio-ast",
    "crates/editio-parser",
    "crates/editio-layout",
    "crates/editio-render",
    "crates/editio-pdf",
    "crates/editio-bib",
    "crates/editio-math",
    "crates/editio-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Editio Team"]
description = "An advanced markdown-based typesetting system for academic writing"

[workspace.dependencies]
pulldown-cmark = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
printpdf = "0.7"
thiserror = "1.0"
