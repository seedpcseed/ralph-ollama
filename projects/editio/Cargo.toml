[workspace]
members = [
    "crates/editio",
    "crates/editio-core",
    "crates/editio-ast",
    "crates/editio-parser",
    "crates/editio-layout",
    "crates/editio-render",
    "crates/editio-pdf",
    "crates/editio-bib",
    "crates/editio-math",
    "crates/editio-plugin",
]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.9"
printpdf = "0.7"
